name: PR Title

# PRs are squash-merged and the PR title becomes the commit message on main,
# which Release Please reads to choose version bumps and changelog entries.
# The title must be a Conventional Commit; see CONTRIBUTING.md.

on:
  pull_request:
    types: [ opened, edited, synchronize, reopened ]

permissions:
  contents: read
  pull-requests: read

jobs:
  conventional:
    name: Conventional Commit title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            revert
            deps
            docs
            refactor
            test
            build
            ci
            chore
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The subject "{subject}" must start with a lowercase letter.
      # A PR that changes the schema says what kind of change it is: the title's
      # level (fix: patch, feat: minor, !: major) covers the change headers it
      # adds to the pending migration (scripts/schema.py check-title).
      - uses: actions/checkout@v7
        if: ${{ !startsWith(github.head_ref, 'release-please--') }}
        with:
          fetch-depth: 0
      - name: Title matches the schema change
        if: ${{ !startsWith(github.head_ref, 'release-please--') }}
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BASE: origin/${{ github.base_ref }}
        run: python3 scripts/schema.py check-title "$TITLE" --base "$BASE"
