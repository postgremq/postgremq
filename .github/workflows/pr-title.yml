name: PR Title

# PRs are squash-merged and the PR title becomes the commit message on main,
# which Release Please reads to choose version bumps and changelog entries.
# The title must be a Conventional Commit; see CONTRIBUTING.md.

on:
  pull_request:
    types: [ opened, edited, synchronize, reopened ]

permissions:
  pull-requests: read

jobs:
  conventional:
    name: Conventional Commit title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            revert
            deps
            docs
            refactor
            test
            build
            ci
            chore
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The subject "{subject}" must start with a lowercase letter.
