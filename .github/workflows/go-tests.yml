name: Go Tests

on:
  workflow_call:
    inputs:
      ref:
        description: "Commit, branch or tag to test (default: the triggering commit)"
        type: string
        default: ''

jobs:
  test:
    name: Test Go Client
    runs-on: ubuntu-latest

    strategy:
      matrix:
        go-version: ['1.25', '1.26']

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        ref: ${{ inputs.ref }}
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: ${{ matrix.go-version }}
        cache: false   # the next step caches modules and builds

    - name: Cache Go modules
      uses: actions/cache@v6
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ matrix.go-version }}-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-${{ matrix.go-version }}-

    # The module as published: GOWORK=off, its own go.mod and go.sum. The CLI
    # (cmd/postgremq) is part of it.
    - name: Run tests
      working-directory: postgremq-go
      env:
        GOWORK: 'off'
      run: go test -v -race -timeout=20m -coverprofile=coverage.out -covermode=atomic ./...

  lint:
    name: Lint Go Code
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        ref: ${{ inputs.ref }}

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.26'
        cache-dependency-path: postgremq-go/**/go.sum

    - name: golangci-lint
      uses: golangci/golangci-lint-action@v9
      with:
        version: v2.12
        working-directory: postgremq-go
        args: --timeout=5m

    # Workspace mode (go.work): the examples use this tree's client.
    - name: Build and vet the examples
      run: |
        go build ./postgremq-go/examples/...
        go vet ./postgremq-go/examples/...
