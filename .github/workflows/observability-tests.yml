name: Observability Tests
on:
  workflow_call:
    inputs:
      ref:
        description: "Commit, branch or tag to test (default: the triggering commit)"
        type: string
        default: ''
jobs:
  collector:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache-dependency-path: postgremq-go/**/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: postgremq-ts/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install -r mq/tests/requirements.txt
      - run: npm ci
        working-directory: postgremq-ts
      - uses: dtolnay/rust-toolchain@1.98
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            postgremq-rs/target
          key: ${{ runner.os }}-cargo-example-${{ hashFiles('postgremq-rs/Cargo.toml', 'postgremq-rs/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-example-
      # Built ahead of the test, so its run fits the test's per-client timeout.
      - run: cargo build --locked --example metrics --features otel
        working-directory: postgremq-rs
      - run: pytest observability/test_collector.py -v
