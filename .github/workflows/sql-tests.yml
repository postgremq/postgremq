name: SQL Tests

on:
  workflow_call:
    inputs:
      ref:
        description: "Commit, branch or tag to test (default: the triggering commit)"
        type: string
        default: ''

jobs:
  test:
    name: Test SQL Implementation
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        ref: ${{ inputs.ref }}
        fetch-depth: 0

    # At most one pending migration, versioned by its change headers; every
    # client's copy and latest.sql's recorded version in step (`make sync`);
    # on a PR, released migrations unchanged since the base branch.
    - name: Schema consistent and released migrations unchanged
      env:
        BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
      run: python3 scripts/schema.py check ${BASE:+--base "$BASE"}

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'
        cache: 'pip'
        cache-dependency-path: mq/tests/requirements.txt

    - name: Install dependencies
      working-directory: ./mq
      run: |
        python -m pip install --upgrade pip
        pip install -r tests/requirements.txt

    - name: Run tests
      working-directory: ./mq
      run: pytest tests/tests.py -v --tb=short
