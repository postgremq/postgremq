# Isolated demo: database, Collector, Prometheus and Grafana. No persistent
# volumes (data is in tmpfs): docker compose down removes everything.
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_PASSWORD: postgremq
      POSTGRES_DB: postgremq
    ports:
      - '127.0.0.1:55432:5432'
    volumes:
      - ../mq/sql/latest.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./demo-init.sql:/docker-entrypoint-initdb.d/02-demo.sql:ro
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d postgremq']
      interval: 1s
      timeout: 5s
      retries: 30
  collector:
    image: otel/opentelemetry-collector-contrib:0.147.0
    command: ['--config=/etc/otelcol/collector.yaml']
    environment:
      POSTGREMQ_METRICS_DSN: 'postgres://postgremq_metrics:metrics@postgres:5432/postgremq?sslmode=disable&connect_timeout=5&statement_timeout=5000'
      POSTGREMQ_DATABASE_ID: postgremq-demo
    volumes:
      - ./collector.yaml:/etc/otelcol/collector.yaml:ro
    ports:
      - '127.0.0.1:4318:4318'
      - '127.0.0.1:8889:8889'
    depends_on:
      postgres:
        condition: service_healthy
  prometheus:
    image: prom/prometheus:v3.15.0
    volumes:
      - ./dashboards/grafana/demo/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
    tmpfs:
      - /prometheus:mode=1777  # Prometheus runs as nobody
    ports:
      - '127.0.0.1:59090:9090'
    depends_on:
      - collector
  # Anonymous viewing, on loopback only. Sign in as admin/admin to edit.
  grafana:
    image: grafana/grafana:13.2.3
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/postgremq/postgremq-overview.json
    volumes:
      - ./dashboards/grafana/demo/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./dashboards/grafana/demo/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./dashboards/grafana:/etc/grafana/dashboards/postgremq:ro
    tmpfs:
      - /var/lib/grafana:exec  # Grafana runs plugin binaries from here
    ports:
      - '127.0.0.1:53000:3000'
    depends_on:
      - prometheus
